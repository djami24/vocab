<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Darajalar | Lug'at</title>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">Lug'at<span class="dot">.</span></div>
    <div class="userchip">
      <a href="games.html" class="chip-link">🎮 O'yinlar</a>
      <a href="stats.html" class="chip-link">📊 Statistika</a>
      <span id="userLabel">—</span>
      <button id="logoutBtn">Chiqish</button>
    </div>
  </div>

  <div class="dash">
    <div class="dash-head">
      <h1>Qaysi darajadan davom etamiz?</h1>
      <p>Har bir daraja o'zining alohida so'zlar to'plamiga ega — bir daraja ichida bir xil so'z ikki marta chiqmaydi.</p>
    </div>

    <div class="stats-bar" id="statsBar"></div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Barcha darajalardan so'z qidiring... (masalan: apple, ona)" autocomplete="off"/>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="levels" id="levelsGrid"></div>

    <div class="backup-row">
      <button class="btn-ghost" id="exportBtn">⬇ Progressni yuklab olish</button>
      <label class="btn-ghost" for="importFile">⬆ Progressni yuklash
        <input type="file" id="importFile" accept="application/json" style="display:none"/>
      </label>
    </div>
  </div>

  <footer class="site-foot">So'z boyligingiz — sizning brauzeringizda saqlanadi.</footer>
</div>

<script src="js/app.js"></script>
<script>
  let user = null;
  (async () => {
    user = await requireAuth();
    if (!user) return; // requireAuth() allaqachon index.html'ga yo'naltirdi
    document.getElementById('userLabel').textContent = user;
    document.getElementById('logoutBtn').addEventListener('click', logout);
    renderLevels();
    wireSearch();
    wireBackup();
  })();

  async function renderLevels() {
    const grid = document.getElementById('levelsGrid');
    const statsBar = document.getElementById('statsBar');
    grid.innerHTML = LEVELS.map((l, i) =>
      `<div class="level-card" style="opacity:.5" data-idx="0${i+1}">
        <div class="lname">${l.name}</div>
        <div class="ltarget">Yuklanmoqda...</div>
      </div>`
    ).join('');

    const stats = await collectStats(user);

    grid.innerHTML = stats.perLevel.map((row, i) => {
      const { level, learned, total, laterCount, dueReview, isDone, unlocked } = row;
      const pct = total ? Math.round((learned / total) * 100) : 0;

      if (!unlocked) {
        const prevLevel = LEVELS[i - 1];
        return `
        <div class="level-card locked" data-idx="0${i+1}" title="Bu daraja hali qulflangan">
          <div class="level-hit">
            <div class="lname">${level.name}</div>
            <div class="lock-msg">
              <span class="lock-icon">🔒</span>
              <span>Ochish uchun <b>${prevLevel.name}</b> darajasini tugating</span>
            </div>
          </div>
        </div>`;
      }

      return `
      <div class="level-card" data-idx="0${i+1}">
        <button class="level-hit" onclick="location.href='study.html?level=${level.id}'">
          <div class="lname">${level.name}</div>
          <div class="ltarget">Yakuniy maqsad: ${level.target.toLocaleString('en-US')} ta so'z</div>
          <div class="lbar-track">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="lcount"><span>Joriy to'plam</span><b>${learned} / ${total}</b></div>
          </div>
          ${isDone ? `<div class="done-pill">✓ Ushbu to'plam tugallandi</div>` : ''}
        </button>
        <div class="card-btn-row">
          <button class="btn-quiz" ${learned < 4 ? 'disabled title="Test uchun kamida 4 ta so\'z o\'rganilgan bo\'lishi kerak"' : ''} onclick="location.href='quiz.html?level=${level.id}'">📝 Test</button>
          <button class="btn-quiz" ${learned < 4 ? 'disabled title="O\'yinlar uchun kamida 4 ta so\'z o\'rganilgan bo\'lishi kerak"' : ''} onclick="location.href='games.html?level=${level.id}'">🎮 O'yinlar</button>
          ${dueReview > 0 ? `<button class="btn-review" onclick="location.href='study.html?level=${level.id}&mode=review'">🔁 Takrorlash (${dueReview})</button>` : ''}
        </div>
        ${laterCount > 0 ? `
        <div class="later-row">
          <span class="later-tag">↻ Keyinroq: <b>${laterCount}</b> ta so'z</span>
          <button class="btn-later" onclick="location.href='study.html?level=${level.id}&mode=later'">O'rganish</button>
        </div>` : ''}
      </div>`;
    }).join('');

    const overallPct = stats.totalWords ? Math.round((stats.totalLearned / stats.totalWords) * 100) : 0;
    statsBar.innerHTML = `
      <div class="stat-pill">
        <span class="sp-num">${stats.totalLearned}</span>
        <span class="sp-lbl">Jami o'rganilgan so'z</span>
      </div>
      <div class="stat-pill">
        <span class="sp-num">${overallPct}%</span>
        <span class="sp-lbl">Umumiy progress</span>
      </div>
      <div class="stat-pill ${stats.totalLater > 0 ? 'stat-pill--later' : ''}">
        <span class="sp-num">${stats.totalLater}</span>
        <span class="sp-lbl">Keyinroqqa qoldirilgan</span>
      </div>
      <div class="stat-pill stat-pill--streak">
        <span class="sp-num">🔥 ${stats.streak.current}</span>
        <span class="sp-lbl">Kunlik seriya</span>
      </div>
    `;
  }

  function wireSearch() {
    const input = document.getElementById('searchInput');
    const resultsBox = document.getElementById('searchResults');
    let allData = null;
    let debounceTimer = null;

    input.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const q = input.value.trim().toLowerCase();
      if (!q) { resultsBox.classList.remove('show'); resultsBox.innerHTML = ''; return; }
      debounceTimer = setTimeout(async () => {
        if (!allData) allData = await loadAllWords();
        const matches = [];
        for (const { level, words } of allData) {
          for (const w of words) {
            if (w.en.toLowerCase().includes(q) || w.uz.toLowerCase().includes(q)) {
              matches.push({ level, word: w });
              if (matches.length >= 20) break;
            }
          }
          if (matches.length >= 20) break;
        }
        if (matches.length === 0) {
          resultsBox.innerHTML = `<div class="sr-empty">Hech narsa topilmadi.</div>`;
        } else {
          resultsBox.innerHTML = matches.map(m => `
            <button class="sr-item" onclick="location.href='study.html?level=${m.level.id}'">
              <span class="sr-en">${escapeHtml(m.word.en)}</span>
              <span class="sr-uz">${escapeHtml(m.word.uz)}</span>
              <span class="sr-level">${m.level.name}</span>
            </button>`).join('');
        }
        resultsBox.classList.add('show');
      }, 180);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) resultsBox.classList.remove('show');
    });
  }

  function wireBackup() {
    document.getElementById('exportBtn').addEventListener('click', () => exportProgress(user));
    document.getElementById('importFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const obj = JSON.parse(text);
        await importProgressFromObject(user, obj);
        alert('Progress muvaffaqiyatli yuklandi.');
        location.reload();
      } catch (err) {
        alert('Faylni o\'qib bo\'lmadi. Bu to\'g\'ri eksport fayli ekanini tekshiring.');
      }
      e.target.value = '';
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
</script>
</body>
</html>
