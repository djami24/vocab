<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Reyting | Lug'at</title>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">Lug'at<span class="dot">.</span></div>
    <div class="userchip">
      <a href="dashboard.html" class="chip-link">← Darajalar</a>
      <a href="stats.html" class="chip-link">📊 Statistika</a>
      <span id="userLabel">—</span>
      <button onclick="logout()">Chiqish</button>
    </div>
  </div>

  <div class="dash">
    <div class="dash-head">
      <h1>🏆 Reyting</h1>
      <p>Barcha talabalar orasida kim ko'proq so'z o'rgangan — jonli reyting.</p>
    </div>

    <div id="lbRoot">
      <div class="empty-state"><div class="emoji">🏆</div><p>Yuklanmoqda...</p></div>
    </div>
  </div>

  <footer class="site-foot">Reytingda faqat ismingiz va o'rgangan so'zlar soni ko'rinadi.</footer>
</div>

<script src="js/app.js"></script>
<script>
let user = null;

(async () => {
  user = await requireAuth();
  if (!user) return;
  document.getElementById('userLabel').textContent = user;
  render();
})();

async function render() {
  const root = document.getElementById('lbRoot');
  let entries = [];
  try {
    const withTimeout = (p, ms) => Promise.race([
      p,
      new Promise((_, rej) => setTimeout(() => rej(new Error('Vaqt tugadi — internetni tekshiring')), ms))
    ]);
    entries = await withTimeout(fetchLeaderboard(), 15000);
  } catch (e) {
    root.innerHTML = `
      <div class="empty-state">
        <div class="emoji">⚠️</div>
        <p>Reytingni yuklab bo'lmadi.<br/><span style="font-size:12px;opacity:.8">${escapeHtml(e.message || String(e))}</span></p>
        <button class="btn-primary" style="margin-top:14px" onclick="render()">Qayta urinish</button>
      </div>`;
    return;
  }

  if (!entries.length) {
    root.innerHTML = `<div class="empty-state"><div class="emoji">🌱</div><p>Hali hech kim so'z o'rganmagan — birinchi bo'ling!</p></div>`;
    return;
  }

  const myUid = _currentUser ? _currentUser.uid : null;
  const top3 = entries.slice(0, 3);
  const rest = entries.slice(3);

  const medalClass = ['gold', 'silver', 'bronze'];
  const medalIcon = ['🥇', '🥈', '🥉'];

  const podiumHtml = top3.length ? `
    <div class="lb-podium">
      ${top3.map((e, i) => `
        <div class="lb-podium-card ${medalClass[i]}">
          <div class="lb-medal">${medalIcon[i]}</div>
          <div class="lb-podium-avatar">${escapeHtml((e.name || '?')[0].toUpperCase())}</div>
          <div class="lb-podium-name">${escapeHtml(e.name || 'Talaba')}${e.id === myUid ? ' <span class="me-tag" style="display:inline-block;margin-top:2px">Siz</span>' : ''}</div>
          <div class="lb-podium-num">${e.totalLearned || 0}</div>
          <div class="lb-podium-lbl">so'z o'rgangan</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  const listHtml = `
    <div class="lb-list">
      ${rest.map((e, i) => {
        const rank = i + 4;
        const isMe = e.id === myUid;
        return `
          <div class="lb-row ${isMe ? 'is-me' : ''}">
            <div class="lb-rank">#${rank}</div>
            <div class="lb-avatar">${escapeHtml((e.name || '?')[0].toUpperCase())}</div>
            <div class="lb-info">
              <div class="lb-name">${escapeHtml(e.name || 'Talaba')}${isMe ? '<span class="me-tag">Siz</span>' : ''}</div>
              <div class="lb-meta">🔥 ${e.streakCurrent || 0} kunlik seriya</div>
              <div class="lb-bar-wrap"><div class="lb-bar-fill" style="width:${e.pct || 0}%"></div></div>
            </div>
            <div class="lb-nums">
              <div class="lb-num-box">
                <div class="lb-num-val">${e.totalLearned || 0}</div>
                <div class="lb-num-lbl">so'z</div>
              </div>
              <div class="lb-num-box">
                <div class="lb-num-val">${e.pct || 0}%</div>
                <div class="lb-num-lbl">progress</div>
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  root.innerHTML = podiumHtml + listHtml;
}

function escapeHtml(str) { return escapeHtmlGlobal(str); }
</script>
</body>
</html>
