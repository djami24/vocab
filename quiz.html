<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Viktorina | Lug'at</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">Lug'at<span class="dot">.</span></div>
    <div class="userchip">
      <span id="userLabel">—</span>
      <button onclick="logout()">Chiqish</button>
    </div>
  </div>

  <div class="study" id="quizRoot">
    <!-- JS orqali to'ldiriladi -->
  </div>

  <footer class="site-foot">So'z boyligingiz — sizning brauzeringizda saqlanadi.</footer>
</div>

<script src="js/app.js"></script>
<script>
const user = requireAuth();
const params = new URLSearchParams(location.search);
const levelId = params.get('level');
const level = LEVELS.find(l => l.id === levelId);
const root = document.getElementById('quizRoot');
const QUIZ_SIZE = 10;

let questions = [];
let qIdx = 0;
let score = 0;
let answered = false;

if (user) {
  document.getElementById('userLabel').textContent = user;
  if (!level) {
    root.innerHTML = `<div class="empty-state"><div class="emoji">🤔</div><p>Bunday daraja topilmadi.<br><a href="dashboard.html" style="color:var(--mustard)">Darajalarga qaytish</a></p></div>`;
  } else {
    init();
  }
}

async function init() {
  root.innerHTML = `<div class="empty-state"><div class="emoji">🧠</div><p>Viktorina tayyorlanmoqda...</p></div>`;
  let words = [];
  try { words = await loadLevelWords(levelId); } catch (e) {
    root.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>So'zlarni yuklab bo'lmadi.</p></div>`;
    return;
  }
  const progress = getProgress(user);
  const learnedSet = new Set(progress[levelId]);
  let pool = words.filter(w => learnedSet.has(w.en.toLowerCase()));

  if (pool.length < 4) {
    root.innerHTML = `
      <div class="complete-box">
        <div class="emoji">🔒</div>
        <h2>Hali erta</h2>
        <p>Viktorina uchun kamida 4 ta so'zni o'rganib olishingiz kerak. Hozircha ${pool.length} ta so'z o'rganilgan.</p>
        <div class="btns"><a class="btn-secondary" href="study.html?level=${levelId}">O'rganishni davom ettirish</a></div>
      </div>`;
    return;
  }

  const chosen = shuffle(pool).slice(0, Math.min(QUIZ_SIZE, pool.length));
  questions = chosen.map(item => {
    const distractors = shuffle(words.filter(w => w.en !== item.en)).slice(0, 3).map(w => w.uz);
    const options = shuffle([item.uz, ...distractors]);
    return { en: item.en, correct: item.uz, options };
  });
  qIdx = 0; score = 0; answered = false;
  renderQuestion();
}

function renderQuestion() {
  if (qIdx >= questions.length) { renderResult(); return; }
  answered = false;
  const q = questions[qIdx];
  root.innerHTML = `
    <div class="study-head">
      <a href="dashboard.html">← Darajalar</a>
      <span class="counter">🧠 ${level.name} · ${qIdx + 1} / ${questions.length}</span>
    </div>
    <div class="session-track"><div class="session-fill" style="width:${(qIdx / questions.length) * 100}%"></div></div>

    <div class="quiz-card">
      <div class="eyebrow">Bu so'z qanday tarjima qilinadi?</div>
      <div class="quiz-word">${escapeHtml(q.en)}</div>
      <div class="quiz-options" id="quizOptions">
        ${q.options.map((opt, i) => `<button class="quiz-opt" data-opt="${escapeHtml(opt)}" onclick="handleAnswer(this)">${escapeHtml(opt)}</button>`).join('')}
      </div>
    </div>
  `;
}

function handleAnswer(btn) {
  if (answered) return;
  answered = true;
  const q = questions[qIdx];
  const chosen = btn.getAttribute('data-opt');
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => {
    o.disabled = true;
    if (o.getAttribute('data-opt') === q.correct) o.classList.add('correct');
    else if (o === btn) o.classList.add('wrong');
  });
  if (chosen === q.correct) score++;
  setTimeout(() => { qIdx++; renderQuestion(); }, 700);
}

function renderResult() {
  const pct = questions.length ? Math.round((score / questions.length) * 100) : 0;
  setQuizBest(user, levelId, pct);
  const verdict = pct >= 90 ? '🏆 Ajoyib!' : pct >= 70 ? '👏 Yaxshi natija!' : pct >= 50 ? '🙂 Yomon emas' : '💪 Yana mashq qiling';
  root.innerHTML = `
    <div class="complete-box">
      <div class="emoji">🧠</div>
      <h2>${verdict}</h2>
      <p>${questions.length} tadan <b>${score}</b> tasiga to'g'ri javob berdingiz — ${pct}%.</p>
      <div class="btns">
        <button class="btn-primary" style="margin-top:0" onclick="init()">Qayta urinish</button>
        <a class="btn-secondary" href="dashboard.html">Darajalarga qaytish</a>
      </div>
    </div>`;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
