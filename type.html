<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Tez terish | Lug'at</title>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">Lug'at<span class="dot">.</span></div>
    <div class="userchip">
      <span id="userLabel">—</span>
      <button onclick="logout()">Chiqish</button>
    </div>
  </div>

  <div class="study" id="typeRoot">
    <!-- JS orqali to'ldiriladi -->
  </div>

  <footer class="site-foot">So'z boyligingiz — sizning brauzeringizda saqlanadi.</footer>
</div>

<script src="js/app.js"></script>
<script>
const MIN_LEARNED = 4;
const TYPE_SIZE = 10;

let user = null;
const params = new URLSearchParams(location.search);
const levelId = params.get('level');
const level = LEVELS.find(l => l.id === levelId);
const root = document.getElementById('typeRoot');

let queue = [];
let qIdx = 0;
let correctCount = 0;
let answered = false;

(async () => {
  user = await requireAuth();
  if (!user) return; // requireAuth() allaqachon index.html'ga yo'naltirdi
  document.getElementById('userLabel').textContent = user;
  if (!level) {
    root.innerHTML = `<div class="empty-state"><div class="emoji">🤔</div><p>Bunday daraja topilmadi.<br><a href="games.html" style="color:var(--mustard)">O'yinlarga qaytish</a></p></div>`;
  } else {
    init();
  }
})();

async function init() {
  root.innerHTML = `<div class="empty-state"><div class="emoji">⌨️</div><p>Mashq tayyorlanmoqda...</p></div>`;

  const unlocked = await isLevelUnlocked(user, levelId);
  if (!unlocked) { renderLocked(); return; }

  let words = [];
  try { words = await loadLevelWords(levelId); }
  catch (e) {
    root.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>So'zlarni yuklab bo'lmadi.</p></div>`;
    return;
  }

  const progress = getProgress(user);
  const learnedSet = new Set(progress[levelId]);
  const learnedWords = words.filter(w => learnedSet.has(w.en.toLowerCase()));

  if (learnedWords.length < MIN_LEARNED) {
    root.innerHTML = `
      <div class="complete-box">
        <div class="emoji">🔒</div>
        <h2>Hali erta</h2>
        <p>Bu mashq uchun avval shu darajada kamida ${MIN_LEARNED} ta so'zni o'rganing.</p>
        <div class="btns">
          <a class="btn-primary" style="margin-top:0" href="study.html?level=${levelId}">O'rganishni boshlash</a>
          <a class="btn-secondary" href="games.html">O'yinlarga qaytish</a>
        </div>
      </div>`;
    return;
  }

  queue = shuffle(learnedWords).slice(0, Math.min(TYPE_SIZE, learnedWords.length));
  qIdx = 0;
  correctCount = 0;
  renderQuestion();
}

function renderLocked() {
  const idx = LEVELS.findIndex(l => l.id === levelId);
  const prevLevel = LEVELS[idx - 1];
  root.innerHTML = `
    <div class="complete-box">
      <div class="emoji">🔒</div>
      <h2>Bu daraja hali qulflangan</h2>
      <p>Mashq qilish uchun avval <b>${prevLevel.name}</b> darajasini to'liq tugating.</p>
      <div class="btns">
        <a class="btn-primary" style="margin-top:0" href="study.html?level=${prevLevel.id}">${prevLevel.name}'ni davom ettirish</a>
        <a class="btn-secondary" href="games.html">O'yinlarga qaytish</a>
      </div>
    </div>`;
}

function renderQuestion() {
  if (qIdx >= queue.length) { renderResult(); return; }
  answered = false;
  const item = queue[qIdx];

  root.innerHTML = `
    <div class="study-head">
      <a href="games.html?level=${levelId}">← O'yinlar</a>
      <span class="counter">⌨️ Tez terish · ${level.name} · ${qIdx + 1} / ${queue.length}</span>
    </div>
    <div class="session-track"><div class="session-fill" style="width:${(qIdx / queue.length) * 100}%"></div></div>

    <div class="quiz-card">
      <div class="eyebrow">O'zbekcha tarjimasini yozing</div>
      <div class="quiz-word">${escapeHtml(item.en)}</div>
      ${item.ipa ? `<div class="ipa">/${escapeHtml(item.ipa)}/</div>` : ''}
      <form class="type-form" id="typeForm" autocomplete="off">
        <input type="text" id="typeInput" placeholder="Tarjimani shu yerga yozing..." autofocus/>
        <button type="submit">Tekshirish</button>
      </form>
      <div class="quiz-feedback" id="typeFeedback"></div>
    </div>
  `;

  const form = document.getElementById('typeForm');
  const input = document.getElementById('typeInput');
  form.addEventListener('submit', (e) => { e.preventDefault(); checkAnswer(); });
  input.focus();
}

function normalize(str) {
  return str.trim().toLowerCase().replace(/['’‘`]/g, "'").replace(/\s+/g, ' ');
}

function checkAnswer() {
  if (answered) return;
  answered = true;
  const item = queue[qIdx];
  const input = document.getElementById('typeInput');
  const feedback = document.getElementById('typeFeedback');
  const given = input.value;
  const isCorrect = normalize(given) === normalize(item.uz) && given.trim() !== '';

  input.disabled = true;
  document.querySelector('.type-form button').disabled = true;

  if (isCorrect) {
    correctCount++;
    input.classList.add('correct-flash');
    feedback.innerHTML = `<span class="ok">✓ To'g'ri!</span>`;
  } else {
    input.classList.add('wrong-flash');
    feedback.innerHTML = `<span class="bad">✕ Noto'g'ri. To'g'ri javob: <b>${escapeHtml(item.uz)}</b></span>`;
  }
  feedback.innerHTML += `<button class="btn-primary" style="margin-top:14px" onclick="nextQuestion()">Keyingisi →</button>`;
}

function nextQuestion() {
  qIdx++;
  renderQuestion();
}

function renderResult() {
  const pct = Math.round((correctCount / queue.length) * 100);
  const isPerfect = correctCount === queue.length;
  if (isPerfect) setFlag(user, 'quizPerfect');

  root.innerHTML = `
    <div class="complete-box">
      <div class="emoji">${isPerfect ? '🏆' : pct >= 60 ? '👍' : '💪'}</div>
      <h2>Natija: ${correctCount} / ${queue.length}</h2>
      <p>${pct}% to'g'ri javob.${isPerfect ? ' Mukammal natija — tabriklaymiz! 🎉' : ' Yana mashq qilib ko\'ring.'}</p>
      <div class="btns">
        <button class="btn-primary" style="margin-top:0" onclick="init()">Qayta mashq qilish</button>
        <a class="btn-secondary" href="games.html?level=${levelId}">Boshqa o'yin</a>
        <a class="btn-secondary" href="dashboard.html">Darajalarga qaytish</a>
      </div>
    </div>`;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.addEventListener('keydown', (e) => {
  if (!answered) return;
  if (e.code === 'Enter' || e.code === 'Space') {
    if (qIdx < queue.length) { e.preventDefault(); nextQuestion(); }
  }
});
</script>
</body>
</html>
